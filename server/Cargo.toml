[package]
name = "phase-mana-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
engine = { package = "phase-engine", path = "../../phase/crates/engine" }
phase-ai = { path = "../../phase/crates/phase-ai" }
draft-core = { path = "../../phase/crates/draft-core" }
draft-wasm = { path = "../../phase/crates/draft-wasm" }
phase-llm = { path = "../../phase/crates/phase-llm" }
rand_chacha = "0.9"
manabrew-compat = { path = "../../phase/crates/manabrew-compat" }
# Match phase/Cargo.lock: later 5.x versions changed Rust DTO fields.
manabrew-protocol = "=5.2.0"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rfd = "0.15"
percent-encoding = "2"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
engine = { package = "phase-engine", path = "../../phase/crates/engine", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
