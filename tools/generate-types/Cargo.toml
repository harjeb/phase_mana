[workspace]
resolver = "2"
members = ["crates/manabrew-protocol", "crates/manabrew-relay-protocol", "crates/hub-dto"]

[workspace.package]
license = "AGPL-3.0-or-later"
repository = "https://github.com/witchesofthehill/manabrew"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["no-serde-warnings"] }
